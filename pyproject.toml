[project]
name = "semantic-rag"
version = "0.1.0"
description = "Hybrid retrieval pipeline (BM25 + dense + RRF + rerank) from scratch using FiQA-2018."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "bm25s>=0.2.13",
    "cohere>=5.13.0",
    "datasets>=3.2.0",
    "numpy>=2.1.0",
    "openai>=2.2.0",
    "pandas>=2.2.0",
    "pyarrow>=18.0.0",
    "python-dotenv>=1.0.1",
    "tiktoken>=0.8.0",
    "tqdm>=4.67.1",
]

[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
    "pytest>=9.0.3",
    "ruff>=0.15.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
src = ["src"]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"